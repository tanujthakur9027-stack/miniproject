<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Customer Support Chat</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #192238;
      background: #f5f7fb;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 10% 5%, #e7ecff 0, transparent 38%),
        radial-gradient(ellipse at 95% 95%, #e0f6f1 0, transparent 34%),
        #f5f7fb;
    }

    .chat-card {
      width: min(100%, 760px);
      height: min(850px, calc(100vh - 48px));
      min-height: 540px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #e6eaf1;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 24px 70px #24345b1a;
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 22px 26px;
      color: white;
      background: linear-gradient(115deg, #343f9c, #5269cf);
    }

    .avatar {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid #ffffff55;
      border-radius: 15px;
      background: #ffffff1c;
      font-size: 22px;
    }

    h1 { margin: 0; font-size: 18px; letter-spacing: .1px; }
    .subtitle { margin: 4px 0 0; color: #e3e8ff; font-size: 13px; }

    .notice {
      margin: 18px 22px 0;
      padding: 11px 14px;
      border: 1px solid #f0e2bd;
      border-radius: 12px;
      color: #6d5521;
      background: #fffaf0;
      font-size: 12px;
      line-height: 1.5;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 22px;
      scroll-behavior: smooth;
    }

    .message {
      width: fit-content;
      max-width: min(84%, 560px);
      margin: 0 0 14px;
      padding: 12px 15px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message.bot {
      border: 1px solid #e9edf5;
      border-bottom-left-radius: 5px;
      color: #263148;
      background: #f5f7fb;
    }

    .message.user {
      margin-left: auto;
      border-bottom-right-radius: 5px;
      color: #fff;
      background: #4c5fc1;
    }

    .message.error {
      border-color: #f3d0d0;
      color: #8c3030;
      background: #fff4f4;
    }

    .meta {
      display: block;
      margin-top: 7px;
      color: #778196;
      font-size: 11px;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 22px 15px;
    }

    .suggestion {
      padding: 8px 11px;
      border: 1px solid #dfe4f2;
      border-radius: 999px;
      color: #45539b;
      background: white;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .suggestion:hover { background: #f2f4ff; }

    form {
      display: flex;
      gap: 10px;
      padding: 16px 22px 20px;
      border-top: 1px solid #edf0f5;
    }

    input {
      min-width: 0;
      flex: 1;
      padding: 13px 15px;
      border: 1px solid #dce2ed;
      border-radius: 13px;
      outline: none;
      color: #192238;
      background: #fbfcfe;
      font: inherit;
      font-size: 14px;
    }

    input:focus {
      border-color: #6879d3;
      box-shadow: 0 0 0 3px #6879d31c;
    }

    #send {
      padding: 0 20px;
      border: 0;
      border-radius: 13px;
      color: white;
      background: #4c5fc1;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    #send:hover { background: #3e50ad; }
    #send:disabled { cursor: wait; opacity: .65; }

    @media (max-width: 520px) {
      body { padding: 0; }
      .chat-card {
        width: 100%;
        height: 100dvh;
        min-height: 420px;
        border: 0;
        border-radius: 0;
      }
      header { padding: 18px; }
      .notice { margin: 14px 14px 0; }
      #messages { padding: 16px 14px; }
      .suggestions { padding: 0 14px 12px; }
      form { padding: 13px 14px max(14px, env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>
  <main class="chat-card">
    <header>
      <div class="avatar" aria-hidden="true">✦</div>
      <div>
        <h1>Customer Support</h1>
        <p class="subtitle">Ask a question and I'll point you in the right direction</p>
      </div>
    </header>

    <aside class="notice">
      This demo recognizes common support topics and gives general guidance. It can't
      access accounts, orders, or live store policies. Please don't share passwords
      or payment details.
    </aside>

    <section id="messages" aria-live="polite" aria-label="Chat messages">
      <div class="message bot">Hi! How can I help you today?</div>
    </section>

    <div class="suggestions" aria-label="Suggested questions">
      <button class="suggestion" type="button">Where is my order?</button>
      <button class="suggestion" type="button">How do I get a refund?</button>
      <button class="suggestion" type="button">I need to reset my password</button>
    </div>

    <form id="chat-form">
      <input id="question" name="question" type="text" maxlength="1000"
             placeholder="Type your question..." autocomplete="off"
             aria-label="Your question" required>
      <button id="send" type="submit">Send</button>
    </form>
  </main>

  <script>
    const form = document.querySelector("#chat-form");
    const input = document.querySelector("#question");
    const sendButton = document.querySelector("#send");
    const messages = document.querySelector("#messages");

    function addMessage(text, type, intent, confidence) {
      const message = document.createElement("div");
      message.className = `message ${type}`;
      message.textContent = text;
      if (intent) {
        const meta = document.createElement("span");
        meta.className = "meta";
        meta.textContent = `Topic: ${intent.replaceAll("_", " ")} · Model confidence: ${Math.round(confidence * 100)}%`;
        message.append(meta);
      }
      messages.append(message);
      messages.scrollTop = messages.scrollHeight;
    }

    async function ask(question) {
      const cleaned = question.trim();
      if (!cleaned || sendButton.disabled) return;

      addMessage(cleaned, "user");
      input.value = "";
      sendButton.disabled = true;
      sendButton.textContent = "...";
      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: cleaned })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "The request failed.");
        addMessage(data.answer, "bot", data.intent, data.confidence);
      } catch (error) {
        addMessage(error.message || "Couldn't reach the chat service. Please try again.", "bot error");
      } finally {
        sendButton.disabled = false;
        sendButton.textContent = "Send";
        input.focus();
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      ask(input.value);
    });

    document.querySelectorAll(".suggestion").forEach((button) => {
      button.addEventListener("click", () => ask(button.textContent));
    });
  </script>
</body>
</html>
